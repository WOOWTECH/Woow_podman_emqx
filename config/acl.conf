%% Default topic policy, matching the PaaS EMQX chart 0.1.11.
%% A client with username sensor01 may publish and subscribe to sensor01/#.
%% Reject usernames containing MQTT wildcards or beginning with $.
%% A dashboard-created superuser or a later dashboard ACL may grant more.
{allow, {username, {re, "^[^$+#][^+#]*$"}}, all, ["${username}/#"]}.
