# One dashboard and MQTT WebSocket entrance. Backend listeners share this
# network namespace and are reached through loopback only.
worker_processes 2;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;
events { worker_connections 4096; }

http {
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  # Use the TCP peer for rate limiting. Client-supplied forwarded headers
  # cannot bypass the limit or impersonate a privileged local MQTT client.
  limit_req_zone $binary_remote_addr zone=woow_login:1m rate=10r/m;
  limit_req_status 429;

  server {
    listen 18083;
    server_name _;
    client_max_body_size 100m;

    location = /healthz { return 200 "ok\n"; }
    # Local container health check; never return the node name to a LAN client.
    location = /readyz {
      allow 127.0.0.1;
      deny all;
      proxy_pass http://127.0.0.1:18093/status;
      proxy_connect_timeout 2s;
      proxy_read_timeout 3s;
    }

    location ^~ /api/v5/prometheus/ { return 404; }
    location ^~ /api-docs { return 404; }
    location ^~ /status { return 404; }
    location ^~ /api/v5/status { return 404; }

    location ^~ /api/v5/login {
      limit_req zone=woow_login burst=5 nodelay;
      proxy_pass http://127.0.0.1:18093;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 300s;
    }

    location = /mqtt {
      proxy_pass http://127.0.0.1:8093;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Port "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass http://127.0.0.1:18093;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
      # EMQX 5.8 dashboard's browser MQTT client otherwise chooses :8084
      # on an HTTPS page, while the entrance is normally published on :443.
      proxy_set_header Accept-Encoding "";
      sub_filter_types application/javascript text/javascript;
      sub_filter '"http:"===window.location.protocol?8083:8084' '"http:"===window.location.protocol?8083:(+window.location.port||443)';
    }
  }
}
